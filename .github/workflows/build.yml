name: Build nx-update NRO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up dependencies
      run: |
        sudo dkp-pacman -Syu --noconfirm
        sudo dkp-pacman -S --noconfirm switch-cmake switch-pkg-config switch-libdrm switch-glad switch-glm switch-mbedtls switch-curl switch-bzip2 switch-libpng switch-libjpeg-turbo switch-libwebp switch-zlib switch-freetype switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-sdl2_gfx switch-sdl2_mixer switch-mesa switch-libopus switch-libvorbis switch-libogg

    - name: Configure CMake
      run: |
        source /etc/profile.d/devkit-env.sh
        # switch-cmake sets up the toolchain automatically
        aarch64-none-elf-cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        source /etc/profile.d/devkit-env.sh
        cmake --build build -j$(nproc)

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: nx-update
        path: build/nx-update.nro
